name: Deploy LBill Web API to GCP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restore dependencies
      - name: Restore
        run: dotnet restore

      # 4. Build
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 5. Publish
      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --no-build

      # 6. Configure SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      # 7. Clean old deployment
      - name: Prepare deployment directory
        run: |
          ssh -i ~/.ssh/gcp_key \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "rm -rf /var/www/lbill_web_api/*"

      # 8. Upload new published files
      - name: Upload application
        run: |
          scp -i ~/.ssh/gcp_key -r ./publish/* \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/lbill_web_api/

      # 9. Restart API
      - name: Restart API
        run: |
          ssh -i ~/.ssh/gcp_key \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo -n systemctl restart lbill_web_api"

      # 10. Verify API service
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/gcp_key \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo -n systemctl is-active lbill_web_api"